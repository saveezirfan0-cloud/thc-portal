name: deploy

# Why this exists
# ---------------
# Nothing deployed the database. `ci.yml` runs `supabase start`, which is a
# throwaway local stack, and `supabase test db` against it — neither touches
# the real project. The live database was pushed by hand once, on
# 21.09.2026, and then sat seventeen migrations behind `main` while the whole
# jobs layer, the Client Portal, /apply, compliance, leaving and GDPR removal
# landed. Nobody noticed, because every test was green.
#
# This runs `supabase db push`, which applies the migration FILES. That
# matters more than the automation does: a file is byte-exact, where anything
# hand-copied into a SQL console can differ from what CI proved by a single
# character and never be caught by anything.

on:
  # Deploy only what CI has already proved. `workflow_run` fires after ci
  # finishes on main, and the `if` below drops the run when it failed, so a
  # red main never reaches the database.
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# One deploy at a time. Two `db push` runs racing on the same project is how
# a migration history ends up half applied.
concurrency:
  group: deploy-database
  cancel-in-progress: false

jobs:
  database:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Missing secrets are a setup state, not a failure: the repo should not
      # go red for everyone because the project is not wired up yet. This says
      # exactly which secret is absent and stops.
      - name: check the deploy secrets are present
        id: secrets
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: ${{ secrets.SUPABASE_PROJECT_ID }}
          PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          missing=
          [ -z "$TOKEN" ]    && missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -z "$REF" ]      && missing="$missing SUPABASE_PROJECT_ID"
          [ -z "$PASSWORD" ] && missing="$missing SUPABASE_DB_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::notice::Database deploy skipped — missing secret(s):$missing"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: supabase/setup-cli@v1
        if: steps.secrets.outputs.ready == 'true'
        with: { version: latest }

      # --dry-run first, so the log records what WOULD be applied even when
      # the push then fails. Without it a failed deploy leaves no trace of
      # which migration it choked on.
      - name: list the migrations still to apply
        if: steps.secrets.outputs.ready == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}"
          supabase db push --dry-run

      - name: apply them
        if: steps.secrets.outputs.ready == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push
