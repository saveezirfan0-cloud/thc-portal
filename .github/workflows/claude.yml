name: claude
on:
  issue_comment: { types: [created] }
  pull_request_review_comment: { types: [created] }
  issues: { types: [opened, labeled] }
  pull_request: { types: [opened, synchronize] }
jobs:
  claude:
    if: >
      (github.event_name == 'pull_request') ||
      contains(github.event.comment.body || github.event.issue.body || '', '@claude')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Pick the domain bot from the label
        id: bot
        run: |
          labels='${{ toJson(github.event.issue.labels || github.event.pull_request.labels) }}'
          bot=$(echo "$labels" | grep -o 'domain:[a-z-]*' | head -1 | sed 's/domain://')
          echo "bot=${bot:-platform}" >> "$GITHUB_OUTPUT"
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            ${{ github.event_name == 'pull_request'
                && 'Act as the qa-reviewer agent (.claude/agents/qa-reviewer.md). Review this PR against the scope and wireframes and post the checklist as a PR comment.'
                || format('Act as the {0} agent (.claude/agents/{0}.md). Handle the request in this thread. Open a PR on a branch feat/{0}-<short-name> if code changes are needed.', steps.bot.outputs.bot) }}
          claude_args: '--max-turns 60'
