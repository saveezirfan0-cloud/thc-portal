name: ci
on:
  pull_request:
  push:
    branches: [main]

# Neither job writes to the repository, and `deploy-database` runs beside the
# live database's credentials. Least privilege for the default GITHUB_TOKEN.
# The other half of this — putting the three Supabase secrets in a `production`
# environment scoped to `main`, rather than leaving them as repository secrets
# any workflow can read — needs a repository setting. See docs/14 O13.
permissions:
  contents: read
  # Read-only, and only so the overlap check below can list open pull
  # requests. It writes nothing; the least-privilege note above still holds.
  pull-requests: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Version comes from package.json packageManager; naming it here as well
      # makes the action fail with "multiple versions".
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      # First, because it costs milliseconds and the failure it catches
      # otherwise costs three minutes of `supabase start` before anyone
      # learns anything. Four collisions in one afternoon, two of which took
      # main down — see docs/14 O2 and the script's own header.
      - name: no two files share a number
        run: node scripts/check-file-numbering.mjs
      # Milliseconds, and it catches a failure that is otherwise invisible:
      # an app writing an admin-only table is refused at runtime and the
      # screen still reports success. See docs/14 O13.
      - name: no app writes an admin-only table directly
        run: node scripts/check-write-paths.mjs
      # Also milliseconds. CLAUDE.md says a screen is done when its states are
      # listed in the inventory; nothing enforced it, and by 23.09 the document
      # was missing a dozen routes AND still named two the Staff App has never
      # served. A session reads that page to decide what is built, so a wrong
      # row is worse than a missing one.
      - name: the screen inventory names every route
        run: node scripts/check-screen-inventory.mjs
      # Advisory, never fails: it reports which files another OPEN pull
      # request is also editing. Five times in one day two sessions built
      # the same thing, and one pair came within an editing decision of
      # deleting a shipped rule with a green build. git reports none of it
      # until merge. See the script's header and docs/10.
      - name: what else is editing these files
        if: github.event_name == 'pull_request'
        run: node scripts/check-pr-overlap.mjs --pr ${{ github.event.pull_request.number }} | tee -a "$GITHUB_STEP_SUMMARY"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo lint typecheck test
      # The token is for resolving "latest": unauthenticated, the action asks
      # api.github.com for the newest release and shares the runner's 60/h
      # anonymous quota with everything else on that address, which is how
      # 8e02c65 failed before a test ran ("rate limit exceeded").
      - uses: supabase/setup-cli@v1
        with:
          version: latest
          github-token: ${{ github.token }}
      # Supabase takes the digits before the first underscore as a
      # migration's version and makes that the primary key of
      # supabase_migrations.schema_migrations, so two files sharing one
      # number is fatal: the second to apply is rejected and every step
      # after `supabase start` is skipped.
      #
      # This has broken main three times in one morning (#5/#7 both took
      # 0006, then #3 took it again), and every time it broke on main
      # rather than on the pull request that caused it — because a
      # collision does not exist until two branches are in one tree. A
      # `pull_request` run builds exactly that tree, so this check sees
      # it; it is two lines and it fails with the numbers named, instead
      # of an opaque 23505 sixty lines into a container pull.
      - name: migration versions are unique
        run: |
          dupes=$(ls supabase/migrations | sed 's/_.*//' | sort | uniq -d)
          if [ -n "$dupes" ]; then
            echo "::error::Two migrations share a version: $dupes"
            ls -1 supabase/migrations
            exit 1
          fi
      # `supabase start` applies supabase/migrations/* and then supabase/seed.sql.
      - run: supabase start
      # The seed must be re-runnable against an already seeded database
      # (Phase 0). Replaying it here fails the build if an upsert key is
      # missing, and 060_seed_shape.sql below catches any duplicated rows.
      - name: seed is idempotent
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -q -f supabase/seed.sql
      # pgTAP RLS suite for admin / client / staff / anon. `supabase test db`
      # runs pg_prove recursively over supabase/tests with --ext .sql/.pg, so
      # supabase/tests/_shared/fixtures.psql is included by the tests and is
      # never picked up as a test of its own.
      - run: supabase test db
      - run: pnpm dlx playwright install --with-deps chromium
      # The apps query Supabase server-side and gate every route behind a
      # session, so the browser suite needs the local stack `supabase start`
      # brought up above. Without these the servers boot and then throw on the
      # first request.
      # `supabase status -o env` prints shell-sourceable lines, so every value
      # arrives wrapped in double quotes: API_URL="http://127.0.0.1:54321".
      # $GITHUB_ENV takes everything after the first = literally, quotes and
      # all, so the apps received a URL beginning with a quote character and
      # every request died on `Invalid supabaseUrl: Must be a valid HTTP or
      # HTTPS URL`. Playwright then waited the full 120 s for a server that
      # was never going to come up. The sed strips the wrapping quotes and
      # leaves an unquoted line untouched.
      - name: point the apps at the local Supabase stack
        run: supabase status -o env | sed 's/="/=/; s/"$//' >> "$GITHUB_ENV"
      # Fail here, loudly, rather than in a two-minute webServer timeout whose
      # log says nothing about the cause.
      - name: check the stack variables resolved
        run: |
          for v in API_URL ANON_KEY SERVICE_ROLE_KEY; do
            if [ -z "${!v}" ]; then
              echo "::error::$v is empty after 'supabase status -o env'. The browser suite cannot boot the apps."
              exit 1
            fi
          done
          case "$API_URL" in
            http://*|https://*) echo "API_URL resolved to ${API_URL}" ;;
            *) echo "::error::API_URL is not an http(s) URL: [$API_URL]"; exit 1 ;;
          esac
      - run: pnpm turbo e2e:smoke
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.API_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SERVICE_ROLE_KEY }}
          APP_TZ: Europe/London

  # =====================================================================
  # Deploy the database
  #
  # Why this is a job in `ci` and not a workflow of its own
  # ------------------------------------------------------
  # It WAS a workflow of its own — `deploy.yml`, triggered by
  # `workflow_run` on `ci` completing. It never ran once. GitHub only
  # registers `workflow_run`, `schedule` and `workflow_dispatch` triggers
  # from the file as it exists on the repository's DEFAULT branch, and
  # this repository's default branch is not `main` (see docs/14 O13). So
  # `deploy.yml` sat on `main`, looking like a deploy, while `ci` went
  # green on `main` five times and the live project stayed twenty-six
  # migrations behind. A workflow that cannot fire is worse than no
  # workflow, because it stops anyone looking for the missing one.
  #
  # `push` has no such rule: it runs the workflow file from the commit
  # that was pushed, on whatever branch it was pushed to. `ci` already
  # triggers that way and demonstrably runs on `main`, so putting the
  # deploy here makes it fire today, without anyone changing a repository
  # setting. It also gets the gate for free — `needs: build-test` means
  # the deploy is skipped unless the tests that ran against THIS commit
  # passed, which is stricter than `workflow_run` was.
  #
  # What it does is still the point: `supabase db push` applies the
  # migration FILES. A file is byte-exact, where anything hand-copied into
  # a SQL console can differ from what CI proved by one character and
  # never be caught by anything.
  # =====================================================================
  deploy-database:
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # One deploy at a time. Two `db push` runs racing on the same project
    # is how a migration history ends up half applied.
    #
    # Known cost of doing this inside `ci`: with one run in progress and one
    # pending, a third merge cancels the pending one, and a cancelled job
    # makes its whole `ci` run conclude `cancelled`. That reads as a red run
    # on `main` whose tests all passed. No migration is lost — `db push` is
    # cumulative and the newest run applies them — but check WHICH job went
    # red before treating it as a test failure.
    concurrency:
      group: deploy-database
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      # Missing secrets are a setup state, not a failure: the repo should
      # not go red for everyone because the project is not wired up yet.
      # This says exactly which secret is absent and stops.
      - name: check the deploy secrets are present
        id: secrets
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: ${{ secrets.SUPABASE_PROJECT_ID }}
          PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          missing=
          [ -z "$TOKEN" ]    && missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -z "$REF" ]      && missing="$missing SUPABASE_PROJECT_ID"
          [ -z "$PASSWORD" ] && missing="$missing SUPABASE_DB_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::notice::Database deploy skipped — missing secret(s):$missing"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: supabase/setup-cli@v1
        if: steps.secrets.outputs.ready == 'true'
        # Authenticated, as above: a deploy must not fail on the anonymous quota.
        with:
          version: latest
          github-token: ${{ github.token }}

      # --dry-run first, so the log records what WOULD be applied even when
      # the push then fails. Without it a failed deploy leaves no trace of
      # which migration it choked on.
      - name: list the migrations still to apply
        if: steps.secrets.outputs.ready == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          supabase link --project-ref "$PROJECT_REF"
          supabase db push --dry-run

      # Relies on the link state the step above wrote to supabase/.temp/.
      # If that step is ever removed or reordered, this one needs its own
      # `supabase link` or it will not know which project to push to.
      #
      # No --include-all: every pending migration currently sorts above the
      # newest version applied remotely, so `db push` takes them all. If a
      # renumbering (docs/14 O2) ever leaves a file BELOW that high-water
      # mark, `db push` skips it and says so — the silent-nothing-happened
      # failure this job exists to kill. Read the log, do not add the flag
      # blind.
      - name: apply them
        if: steps.secrets.outputs.ready == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push
